{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="{% static 'operation/css/login.css' %}">
</head>
<body>
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p class="message {{ message.tags }}">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <div class="modificar-datos-container">
        <h1 class="modificar-datos-title">Login - Doctor</h1>
        <form method="post" action="">
            {% csrf_token %}
            <div class="Rectangulo">
                <h3>Iniciar Sesión</h3>

                <label for="cedula">Cédula:</label>
                <input type="number" id="cedula" name="cedula" required/><br>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required/><br>

                <button type="submit">Continuar</button>
            </div>
        </form>
        <div class="container">
            <div class="buttons">
                <a href="{% url 'core:core' %}" class="btn">Volver a la Página Principal</a>
            </div>
        </div>
    </div>
</body>
</html>
